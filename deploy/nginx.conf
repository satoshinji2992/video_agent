# Template: set server_name and TLS for your host; create the htpasswd file before enabling basic auth.
# /etc/nginx/sites-available/video-agent  (open only port 80 in the security group)
server {
    # default_server so requests by IP reach this site rather than Ubuntu's welcome page.
    listen 80 default_server;
    server_name _;

    # Access control: either basic auth (htpasswd -c /etc/nginx/.video-agent.htpasswd <user>)
    # or restrict by IP in the security group. Remove these two lines only if IP filtering is used.
    auth_basic "Video agent demo";
    auth_basic_user_file /etc/nginx/.video-agent.htpasswd;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The server limits uploads per client address and takes it from here (last hop).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
