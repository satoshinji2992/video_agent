<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Video Bot</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preload" href="/static/fonts/bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/bricolage-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m20.5 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 4h6l-1 5 3 3H7l3-3-1-5zM12 12v8"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 16V5m-5 5 5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></g></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></g></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></g></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9zM18.5 15l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M10 9.5v5l4.2-2.5z" fill="currentColor"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4.5 7h15M10 4h4M6.5 7l.9 12a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-12M10 11v6M14 11v6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7 10.5V20H4.5a1 1 0 0 1-1-1v-7.5a1 1 0 0 1 1-1H7zm0 0 4-7a2.2 2.2 0 0 1 2.6 2.6L13 9h5.6a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17.2 20H7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M17 13.5V4h2.5a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1H17zm0 0-4 7a2.2 2.2 0 0 1-2.6-2.6L11 15H5.4a2 2 0 0 1-2-2.4l1.4-7A2 2 0 0 1 6.8 4H17"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2"/><circle cx="18" cy="18.5" r="2"/><path d="M8 5.5h8a3.5 3.5 0 0 1 0 7H8a3.5 3.5 0 0 0 0 7h8"/></g></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v3.8h-3.8"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <button class="bot-chip" id="botChip"></button>
      <button class="icon-btn" id="newBtn" title="新对话" aria-label="新对话"><svg width="19" height="19"><use href="#i-edit"/></svg></button>
    </div>
    <label class="search"><svg width="16" height="16"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索对话"></label>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <button class="foot-btn" id="skillsEntry"><svg width="16" height="16"><use href="#i-spark"/></svg><span id="skillsCount">技能</span></button>
      <button class="foot-btn" id="systemEntry"><svg width="16" height="16"><use href="#i-gear"/></svg><span class="lbl">系统<i class="status-dot" id="statusDot"></i></span></button>
    </div>
  </aside>

  <section class="main" id="main">
    <div class="topbar">
      <button class="icon-btn back" id="back" aria-label="返回"><svg width="22" height="22"><use href="#i-back"/></svg></button>
      <div class="who" id="who">
        <div class="who-top"><span class="wordmark wm-xs" aria-label="Video Bot"><b>Video</b> <span>Bot</span></span><span id="presence"></span></div>
        <b id="convTitle" class="conv-title" title="点击重命名"></b>
      </div>
      <select class="model-sel" id="modelSel" aria-label="对话模型" title="这个对话使用的模型"></select>
      <button class="icon-btn" id="trajBtn" aria-label="轨迹" title="轨迹和点评"><svg width="20" height="20"><use href="#i-route"/></svg></button>
      <button class="icon-btn" id="infoBtn" aria-label="资料"><svg width="20" height="20"><use href="#i-info"/></svg></button>
    </div>
    <div class="scroller" id="scroller"><div id="log"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="bar">
          <button class="icon-btn" id="attach" aria-label="添加文件" title="添加文件"><svg width="20" height="20"><use href="#i-clip"/></svg></button>
          <button class="icon-btn" id="skillBtn" aria-label="技能" title="使用技能"><svg width="19" height="19"><use href="#i-spark"/></svg></button>
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime,.mov,.mp4,.m4v,audio/*,.wav,.mp3,.m4a,application/pdf,.pdf,.txt,.md,.csv" multiple hidden>
          <textarea id="input" rows="1" placeholder="描述你想生成的视频"></textarea>
          <button class="send" id="send" aria-label="发送" disabled><svg width="18" height="18"><use href="#i-send"/></svg></button>
        </div>
        <div class="popover" id="skillMenu" hidden></div>
      </div>
      <div class="hint">Enter 发送 · Shift + Enter 换行 · 支持拖入或粘贴文件</div>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="profile" id="profile" aria-label="资料">
      <button class="icon-btn close" id="closeProfile" aria-label="关闭"><svg width="20" height="20"><use href="#i-close"/></svg></button>
      <div class="head"><span class="wordmark wm-xl" aria-label="Video Bot"><b>Video</b> <span>Bot</span></span><span id="pTitle"></span></div>
      <h3>简介</h3><p id="pDesc"></p>
      <h3>当前对话</h3><p id="pConv"></p>
      <h3>已启用技能</h3><div id="pSkills"></div>
    </aside>
    <aside class="profile traj" id="traj" aria-label="轨迹">
      <div class="traj-head"><b>轨迹</b><span class="sub" id="trajSub"></span>
        <a class="icon-btn" id="trajDownload" download title="下载 trajectory.jsonl" aria-label="下载轨迹文件"><svg width="18" height="18"><use href="#i-download"/></svg></a>
        <button class="icon-btn" id="trajRefresh" title="刷新" aria-label="刷新"><svg width="18" height="18"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="closeTraj" aria-label="关闭"><svg width="20" height="20"><use href="#i-close"/></svg></button></div>
      <div class="traj-body" id="trajBody"></div>
    </aside>
  </section>
</div>

<div class="modal-back" id="sysBack" hidden>
  <div class="modal" role="dialog" aria-label="系统">
    <div class="modal-head">
      <button class="icon-btn modal-back-btn" id="sysClose2" aria-label="返回"><svg width="22" height="22"><use href="#i-back"/></svg></button>
      <b>系统</b>
      <button class="icon-btn" id="sysClose" aria-label="关闭"><svg width="20" height="20"><use href="#i-close"/></svg></button>
    </div>
    <div class="modal-body">
      <nav class="tabs" id="tabs">
        <button data-tab="usage" class="on">用量</button>
        <button data-tab="models">模型</button>
        <button data-tab="reviews">轨迹</button>
        <button data-tab="memory">记忆</button>
        <button data-tab="skills">技能</button>
        <button data-tab="status">服务状态</button>
        <button data-tab="trash">回收站</button>
        <button data-tab="about">关于</button>
      </nav>
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="menu" id="convMenu" role="menu" hidden></div>
<div class="modal-back confirm" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true"><b></b><p></p><div class="btns"><button class="btn no">取消</button><button class="btn primary yes">确定</button></div></div>
</div>
<div class="lightbox" id="lightbox" hidden><div class="lb-inner"><video controls autoplay loop playsinline></video><img alt="" hidden><div class="cap"></div></div></div>

<script src="/static/app.js"></script>
</body>
</html>
